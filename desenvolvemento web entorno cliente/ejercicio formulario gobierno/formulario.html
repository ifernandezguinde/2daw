<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Sede Electrónica</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        form { max-width: 600px; margin: auto; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        .error { color: red; font-size: 0.9em; }
        button { margin-top: 20px; padding: 10px; width: 100%; }
    </style>
</head>

<body>
    <h1>Formulario de Registro</h1>

    <form id="formRegistro" novalidate>
        <!-- NOMBRE -->
        <label>Nombre *</label>
        <input type="text" id="nombre">
        <div class="error" id="errNombre"></div>

        <!-- APELLIDOS -->
        <label>Primer apellido *</label>
        <input type="text" id="apellido1">
        <div class="error" id="errApellido1"></div>

        <label>Segundo apellido</label>
        <input type="text" id="apellido2">
        <div class="error" id="errApellido2"></div>

        <!-- DOCUMENTO -->
        <label>Tipo documento *</label>
        <select id="tipoDoc">
            <option value="">Seleccione</option>
            <option value="DNI">DNI</option>
            <option value="NIE">NIE</option>
        </select>
        <div class="error" id="errTipoDoc"></div>

        <label>Nº Documento *</label>
        <input type="text" id="numDoc" placeholder="8 números + letra">
        <div class="error" id="errNumDoc"></div>

        <!-- FECHA -->
        <label>Fecha de nacimiento *</label>
        <input type="date" id="fechaNacimiento">
        <div class="error" id="errFecha"></div>

        <!-- EMAIL -->
        <label>Correo electrónico *</label>
        <input type="email" id="email">
        <div class="error" id="errEmail"></div>

        <!-- TELÉFONO -->
        <label>Teléfono móvil *</label>
        <input type="tel" id="telefono">
        <div class="error" id="errTelefono"></div>

        <!-- CONTRASEÑA -->
        <label>Contraseña *</label>
        <input type="password" id="password">
        <div class="error" id="errPassword"></div>

        <label>Repetir contraseña *</label>
        <input type="password" id="password2">
        <div class="error" id="errPassword2"></div>

        <!-- CONSENTIMIENTO -->
        <label>
            <input type="checkbox" id="consentimiento"> Acepto el tratamiento de mis datos
        </label>
        <div class="error" id="errConsentimiento"></div>

        <button type="submit">Registrarse</button>
    </form>

    <script src="validaciones.js"></script>
</body>
</html>
