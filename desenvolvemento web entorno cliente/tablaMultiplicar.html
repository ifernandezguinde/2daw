<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Multiplicar</title>

    <script>
        function generar(){
            let numero = parseInt(document.getElementById("valor_numero").value);
            console.log("el numero es :" + numero);
            document.getElementById("title").innerHTML = "Tabla de multiplicar del " + numero;

            for(let i=0; i<=10; i++){
                console.log(numero + " x " + i + " y esto es igual a: " + (numero*i));
                document.getElementById("tabla").innerHTML += "<li>" + numero + " x " + i + " = " + (numero*i) + "</li>";
            }
            
        }
    </script>
</head>
<body>
    <label>Número:</label>
    <input type="text" id="valor_numero" maxlength="2" value="0">
    <input type="button" id="generarTabla" onclick="generar()">
    <h1 id="title"></h1>
    <p id="tabla"></p>
</body>
</html>
