<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 2.6.3</title>

        <style>
            .item1 {grid-area: c1;}
            .item2 {grid-area: c2;}
            .item3 {grid-area: c3;}
            .item4 {grid-area: c4;}

            .contenedor {
                height: 400px;
                padding: 40px;
                margin: 40px 0;
                display: grid;  
                grid-gap: 2px;
                justify-items: stretch;
                justify-content: center;
                grid-template-areas: 
                '. c1 c1'
                'c2 c3 c3'
                'c2 c3 c3'
                'c4 c4 c4';
            }

            .contenedor div {
                height: 1fr;
                color: white;
                background-color: rgb(99, 110, 119);
                text-align: center;
                font-size: 1.5em;
                padding: 20px;
            }

            .contenedor .item1 {
                grid-column: 2 / 4;
                background-color: darkgoldenrod;
                align-content: center;
            }

            .contenedor .item2 {
                grid-column: 1 / 2;
                grid-row: 2;
                padding: 40px;
            }

            .contenedor .item3 {
                grid-column: 2 / 4;
                grid-row: 2;
                text-align: left;
                padding: 20px;
            }

            .contenedor .item4 {
                grid-column: 1 / 4;
                grid-row: 3;
                background-color: rgb(85, 84, 84);
                align-content: center;
            }
        </style>
    </head>
    
    <body>
        <div class="contenedor">
            <div class="item1">celda 1</div>
            <div class="item2">celda 2</div>
            <div class="item3">
            <p>celda 3:<br> contenido que marca el alto de la <br> parte central de la página</p>
            </div>
            <div class="item4">celda 4</div>
        </div>
    </body>
</html>
