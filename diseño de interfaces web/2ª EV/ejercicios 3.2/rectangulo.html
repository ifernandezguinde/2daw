<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {
            width: 400px;
            height: 300px;
            background-color: red;
        }

        div:hover {
            animation-duration: 0.7s;
            animation-name: escala;
        }

        @keyframes escala {
            0% {
                width: 400px;
                height: 300px;
                background-color: red;
            }

            100% {
                width: 200px;
                height: 150px;
                background-color: blue;
            }
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
