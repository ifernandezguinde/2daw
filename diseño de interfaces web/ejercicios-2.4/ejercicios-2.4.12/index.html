<!DOCTYPE html>
<html lang="es">

<head>
    <title>ej12</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: "Noto Sans Bhaiksuki";
            src: url(./fonts/Noto_Sans_Bhaiksuki/NotoSansBhaiksuki-Regular.ttf);
        }

        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&display=swap');

        .font1 {
            font-family: "Noto Sans Bhaiksuki", sans-serif;
            font-size: 2em;
        }

        .font2 {
            font-family: "Oswald", sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
            font-weight: bold;
        }

        .bitcount-grid-single-font3 {
            font-family: "Bitcount Grid Single", system-ui;
            font-optical-sizing: auto;
            font-weight: 200;
            font-style: normal;
            font-variation-settings:
                "slnt" 0,
                "CRSV" 0.5,
                "ELSH" 0,
                "ELXP" 0;
        }
    </style>
</head>

<body>
    <p class="font1">Párrafo 1</p>
    <p class="font2">Párrafo 2</p>
    <p class="font3">Párrafo 3</p>
</body>

</html>
