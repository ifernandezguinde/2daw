<!DOCTYPE html>
<html>
    <head>
        <title>Ejercicio 2.4.8</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>

            .grad1 {
                background-image: linear-gradient(40deg, red, yellow, green, blue, darkviolet, violet);
                width: 100%;
                height: 100px;
            }

            .grad2 {
                background-image: repeating-linear-gradient(to right, red, orange 7%, lightgreen 9%, skyblue 10%);
                width: 100%;
                height: 300px;
            }

            .grad3 {
                background-image: radial-gradient(closest-side at 60% 55%, blue, green, yellow, orange);
                width: 30%;
                height: 300px;
            }

        </style>
    </head>

    <body>
        <div class="grad1"></div>
        <div class="grad2"></div>
        <div class="grad3"></div>
        <div class="grad4"></div>
    </body>
</html>
