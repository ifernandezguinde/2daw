<!DOCTYPE html>
<html lang="es">

<head>
    <title>Ejercicio 2.5.13</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .card-shadow {
            border: 1px solid gray;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
            float: left;
        }

        .card-gradient {
            background-image: linear-gradient(180deg, #3498db, #1f587d);
            color: white;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
            float: left;
        }

        .clear {
            clear: both;
        }

        .filtered-image {
            filter: brightness(80%) contrast(120%);
        }

        .tooltip-container {
            position: relative;
            display: inline-block;
        }

        .tooltip-text {
            visibility: hidden;
            background-color: brown;
            color: white;
            width: 120px;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            top: 125%;
            left: 50%;
            transform: translateX(-50%);
            transition: opacity 0.3s;
            opacity: 0;
        }

        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="card-shadow">
        <h3>Ejemplo de Sombra</h3>
        <p>Esta tarjeta tiene una sombra.</p>
    </div>

    <div class="card-gradient">
        <h3>Ejemplo de Gradiente</h3>
        <p>Este es un fondo con gradiente.</p>
    </div>

    <h3 class="clear">Ejemplo de imagen con filtro y sin filtro</h3>
    <img src="https://cdn-icons-png.flaticon.com/256/4193/4193347.png" alt="Imagen sin filtro">
    <img src="https://cdn-icons-png.flaticon.com/256/4193/4193347.png" alt="Imagen con filtro" class="filtered-image">
    <h3>Ejemplo con tooltip</h3>

    <div class="tooltip-container">
        <span class="tooltip-text">Mensaje del tooltip</span>
        <p>Este elemento tiene un tooltip</p>
    </div>
</body>

</html>
