<!DOCTYPE html>
<html lang="es">

<head>
    <title>Ejercicio 2.5.5</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        
        button {
            padding: 10px, 20px;
            border: none;
            margin: 10px;
            border-radius: 5px;
        }

        .btn-normal {
            background-color: #3498db;
            color: white;
            cursor: crosshair;
        }

        .btn-outline {
            border: 2px solid #3498db;
            background: transparent;
            color: #3498db;
            cursor: pointer;
        }

        .btn-alert {
            background-color: #e74c3c;
            color: white;
            cursor: help;
        }

        button:hover {
            transform: scale(1.1);

        }

    </style>
</head>

<body>
    <button class="btn-normal">Botón Normal</button>
    <button class="btn-outline">Botón Outline</button>
    <button class="btn-alert">Botón Alerta</button>
</body>

</html>
