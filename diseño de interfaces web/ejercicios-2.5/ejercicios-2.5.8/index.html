<!DOCTYPE html>
<html lang="es">

<head>
    <title>Ejercicio 2.5.8</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .div1 {
            width: 200px;
            height: 200px;
            background-color: green;
            transition-delay: 1s;
            transition-duration: 3s;
            transition-timing-function: ease-out;
        }

        .div1:hover {
            transform: rotate(360deg) scaleX(2.0);
            background-color: red;
        }

        .div2 {
            width: 200px;
            height: 200px;
            background-color: rgba(128, 128, 128, 0.4);
            transition-duration: 5s;
            transition-timing-function: ease-in-out;
        }

        .div2:hover {
            transform: skew(20deg, 3deg) translate(50%);
            background-color: pink;
        }
    </style>
</head>

<body>
    <div class="div1">

    </div>

    <div class="div2">

    </div>
</body>

</html>
